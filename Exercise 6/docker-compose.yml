services:
  delivery-metrics:
    build:
      context: ./delivery_monitoring
    container_name: delivery-metrics
    ports:
      - "8000:8000"
    environment:
      PENDING_MIN: "10"
      PENDING_MAX: "20"
      METRICS_INTERVAL: "1"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./delivery_monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./delivery_monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - delivery-metrics
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    name: delivery-monitoring
